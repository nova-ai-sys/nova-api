name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No Ollama and no API keys in CI: every test mocks its model, so a
      # test that needs a real one is a test that needs rewriting.
      - name: Run tests
        run: uv run pytest tests/ -q
